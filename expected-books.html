<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ожидаемые книги</title>
</head>
<body>
  <script>
    fetch('expected-base.html', {cache: 'no-store'})
      .then(response => {
        if (!response.ok) throw new Error('Не удалось загрузить страницу');
        return response.text();
      })
      .then(html => {
        const updated = html.replace('</body>', '<script src="expected-update.js"><\\/script></body>');
        document.open();
        document.write(updated);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<p style="font:18px Arial;padding:32px">Страница временно не загрузилась. Пожалуйста, обновите её.</p>';
      });
  </script>
</body>
</html>
